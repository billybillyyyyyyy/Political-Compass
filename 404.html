<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain Compass</title>
<script>
  // GitHub Pages serves this for any path that does not exist on the site.
  // Send everything to the app, keeping any #result hash, unless we are
  // already at the app path (which would mean index.html itself is missing).
  (function () {
    var base = '/Political-Compass/';
    var here = location.pathname;
    if (here.toLowerCase() !== base.toLowerCase()) location.replace(base + location.hash);
    else if (here !== base) location.replace(base + location.hash);
  })();
</script>
<style>body{font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;max-width:600px;margin:0 auto;color:#1b1b1f}</style>
</head>
<body>
<h1>Plain Compass</h1>
<p>Taking you to the test. If nothing happens, open <a href="/Political-Compass/">/Political-Compass/</a>.</p>
</body>
</html>
